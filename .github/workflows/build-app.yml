name: Build PS5LM Ultra

on:
  push:
    branches:
      - main
      - ultra
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package PS5LM Ultra
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-18 clang-format-18 clang-tidy-18 lld-18 llvm-18 llvm-18-dev libclang-18-dev \
            libclc-18 libclc-18-dev libllvmspirvlib-18-dev llvm-spirv-18 \
            make pkg-config tar unzip wget zip zlib1g-dev \
            ninja-build cmake glslc libvulkan-dev spirv-tools \
            rsync curl git

      - name: Install Python build tools
        run: |
          pip install --upgrade meson ninja mako markupsafe packaging pyyaml

      - name: Configure Clang 18 defaults
        run: |
          for tool in clang clang++ clang-format clang-tidy llvm-ar llvm-ranlib llvm-nm llvm-objcopy lld ld.lld; do
            if [[ -x /usr/bin/${tool}-18 ]]; then
              sudo ln -sfn "/usr/bin/${tool}-18" "/usr/local/bin/${tool}"
            fi
          done
          clang --version | head -n 1
          ld.lld --version | head -n 1
          meson --version

      - name: Fetch and set up PS5 Vulkan toolchain and dependencies
        run: |
          mkdir -p .deps/src
          
          # Fetch exact pinned commits
          if [ ! -d ".deps/src/PS5_PayloadSDK/.git" ]; then
            mkdir -p .deps/src/PS5_PayloadSDK
            git -C .deps/src/PS5_PayloadSDK init
            git -C .deps/src/PS5_PayloadSDK remote add origin https://github.com/mihawk-99/PS5_PayloadSDK.git
            git -C .deps/src/PS5_PayloadSDK fetch --depth 1 origin b83202be73e930050e00de0f1b4d9ec46c0391bf
            git -C .deps/src/PS5_PayloadSDK checkout FETCH_HEAD
          fi

          if [ ! -d ".deps/src/PS5_Mesa/.git" ]; then
            mkdir -p .deps/src/PS5_Mesa
            git -C .deps/src/PS5_Mesa init
            git -C .deps/src/PS5_Mesa remote add origin https://github.com/mihawk-99/PS5_Mesa.git
            git -C .deps/src/PS5_Mesa fetch --depth 1 origin 1ba9874f478657ccf6da72ce55f0260164cc0bd0
            git -C .deps/src/PS5_Mesa checkout FETCH_HEAD
          fi

          if [ ! -d ".deps/src/PS5_Vulkan/.git" ]; then
            mkdir -p .deps/src/PS5_Vulkan
            git -C .deps/src/PS5_Vulkan init
            git -C .deps/src/PS5_Vulkan remote add origin https://github.com/mihawk-99/PS5_Vulkan.git
            git -C .deps/src/PS5_Vulkan fetch --depth 1 origin main
            git -C .deps/src/PS5_Vulkan checkout FETCH_HEAD
          fi

          # Setup PS5 native dependencies (SDK and zlib)
          cd .deps/src/PS5_Vulkan
          bash tools/setup-native-dependencies.sh

          # Build RADV release archive for PS5
          bash tools/build-radv.sh release

          # Build host tools (ps5-native-tool) and libc.prx
          make app
          cd ../../..

      - name: Fetch PS5 OpenGL SDK
        run: |
          mkdir -p .deps/ps5-opengl
          curl -fsSL https://github.com/darkxex/ps5-opengl/releases/download/v1.0.2/ps5-opengl-sdk-1.0.2.tar.gz -o /tmp/ps5-opengl-sdk.tar.gz
          tar -xzf /tmp/ps5-opengl-sdk.tar.gz -C .deps/ps5-opengl

      - name: Build PS5LM Ultra native title
        env:
          PS5_OPENGL_SDK: ${{ github.workspace }}/.deps/ps5-opengl/ps5-opengl-sdk-1.0.2/sdk
        run: |
          chmod +x scripts/build-app.sh scripts/release-app.sh
          scripts/build-app.sh

      - name: Package release ZIP
        run: |
          scripts/release-app.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps5lm-ultra-package
          path: |
            build/release/ps5lm-ultra-*.zip
            build/release/ps5lm-ultra-*.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ps5lm-ultra-package
          path: release-dist

      - name: Publish Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ -z "$tag" || "$tag" == "main" || "$tag" == "ultra" ]]; then
            tag="v1.0.0-ultra"
          fi
          
          files=(release-dist/ps5lm-ultra-*.zip release-dist/ps5lm-ultra-*.zip.sha256)
          
          cat << 'EOF' > release_notes.md
          ### PS5LM Ultra Universal LLM Runner for PS5

          - Universal Model Execution: Models under 11 GiB run via GPU Vulkan with 140+ tok/s throughput; models up to 80B parameters automatically engage the sliding-window shard streaming engine across internal NVMe SSD.
          - TV Pulse Dashboard: Native HDMI display rendering real-time GPU/CPU utilization, thermal telemetry (CPU, SoC, fan speed), and memory allocation.
          - Network Interface: Built-in HTTP server at port 8081 providing web chat UI and OpenAI/Anthropic-compatible completions API.
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --title "PS5LM Ultra $tag" \
              --notes-file release_notes.md
          fi
